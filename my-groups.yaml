# =========================================
#              DNS 设置
# =========================================
# 已移除 nameserver-policy（2026-09-18）：
#   原策略把下面三个域名指向 https://dns.google/dns-query，
#   但插件 respect-rules=0 时该 DoH 查询走直连、在国内被墙 → 解析超时失败，
#   导致 Google Play 下载卡在「等待中」（services.googleapis.cn 是 Play 中国区服务域名）。
#   - services.googleapis.cn：国内 DNS 可正常解析，无需特殊策略
#   - googleapis.cn / xn--ngstr-lra8j.com：裸域名本身无任何 A/AAAA/CNAME 记录，原策略无意义
#   DNS 段其余配置由 OpenClash 插件（yml_change.sh）按插件设置生成，无需在此声明。

# =========================================
#              代理提供商
# =========================================
# Icon 来源: https://github.com/Giveupmoon/Clash_Rules_Yaml
# 通过 sync-rules.yml 同步到 assets/icons/
proxy-providers:
  Sub-store:
    type: http
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://g.cn/generate_204"
      interval: 10
    override:
      skip-cert-verify: true
      udp: true
    path: ./proxy_provider/provider.yaml
    filter: >-
      ^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)).*$
    url: "url"

# =========================================
#             策略组配置
# =========================================
# 所有 icon 引用自 assets/icons/（同步自 Giveupmoon/Clash_Rules_Yaml）
#
# 原始 icon 来源（如需补充新图标）：
#   HOMOMIX/Color/Large 系列:
#     https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/HOMOMIX/Color/Large/<name>.png
#   根目录:
#     https://raw.githubusercontent.com/Giveupmoon/Clash_Rules_Yaml/main/Icon/<name>.png
#
# 当前 assets/icons/ 内的完整文件列表：
#   11111.png, match.png,
#   AI_bot.png, Apple_black.png, Bahamut_i.png, DIRECT.png, Flight.png,
#   Game.png, GitHub.png, Google.png, Hong_Kong.png, Japan.png,
#   Microsoft.png, Network.png, PayPal.png, Singapore.png, SpeedTest.png,
#   Spotify.png, Taiwan_Province.png, Telegram.png, TikTok.png,
#   Twitter.png, USA.png
proxy-groups:

  # --- 地区节点组（url-test 自动选最优） ---
  - name: 香港Vless
    type: url-test
    include-all: true
    filter: >-
      ^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG)).*$
    exclude-type: "Hysteria2|Hysteria"
    url: https://cp.cloudflare.com/generate_204
    icon: "https://fastly.jsdelivr.net/gh/DustyXo/openclash-ruleset@main/assets/icons/Hong_Kong.png"

  - name: 美国节点
    type: url-test
    include-all: true
    filter: >-
      ^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$
    url: https://cp.cloudflare.com/generate_204
    icon: "https://fastly.jsdelivr.net/gh/DustyXo/openclash-ruleset@main/assets/icons/USA.png"

  - name: 日本Vless
    type: url-test
    include-all: true
    filter: >-
      ^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK)).*$
    exclude-type: "Hysteria2|Hysteria"
    url: https://cp.cloudflare.com/generate_204
    icon: "https://fastly.jsdelivr.net/gh/DustyXo/openclash-ruleset@main/assets/icons/Japan.png"

  - name: 新加坡Vless
    type: url-test
    include-all: true
    filter: >-
      ^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP)).*$
    exclude-type: "Hysteria2|Hysteria"
    url: https://cp.cloudflare.com/generate_204
    icon: "https://fastly.jsdelivr.net/gh/DustyXo/openclash-ruleset@main/assets/icons/Singapore.png"

  - name: 台湾节点
    type: url-test
    include-all: true
    filter: >-
      ^(?=.*(?i)(台|TW|tai|TPE|TSA|KHH)).*$
    url: https://cp.cloudflare.com/generate_204
    icon: "https://fastly.jsdelivr.net/gh/DustyXo/openclash-ruleset@main/assets/icons/Taiwan_Province.png"

  # --- 自动选择（所有节点测速选最优） ---
  - name: 自动选择
    type: url-test
    include-all: true
    url: https://cp.cloudflare.com/generate_204
    icon: "https://fastly.jsdelivr.net/gh/DustyXo/openclash-ruleset@main/assets/icons/Flight.png"

  # --- 香新日Hy2 节点组 ---
  - name: 香新日Hy2
    type: url-test
    include-all: true
    filter: >-
      ^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG|日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK|坡|🇸🇬|SG|Sing|SIN|XSP)).*$
