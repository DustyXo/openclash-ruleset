    url: https://cp.cloudflare.com/generate_204
    icon: "https://fastly.jsdelivr.net/gh/DustyXo/openclash-ruleset@main/assets/icons/Flight.png"

  # --- 自定义独立代理（手动切换） ---
  - name: 自定义代理
    type: select
    proxies:
      - 香港Vless
      - 美国节点
